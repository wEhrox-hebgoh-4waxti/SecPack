name: SEC PACK Commerce Tests

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate Worker syntax
        run: node --check worker/advisor.js

      - name: Validate storefront script syntax
        run: node --check assets/js/pages-store.js

      - name: Validate Wrangler Worker bundle
        run: npx --yes wrangler@4.102.0 deploy --dry-run --config wrangler.toml

      - name: Validate local D1 migrations
        run: npx --yes wrangler@4.102.0 d1 migrations apply DB --local --persist-to .wrangler/commerce-test-state

      - name: Run end-to-end commerce smoke test
        run: node test/commerce.smoke.mjs
