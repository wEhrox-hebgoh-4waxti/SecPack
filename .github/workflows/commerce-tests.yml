name: SEC PACK Commerce Tests\n\non:\n  pull_request:\n    branches: ["main"]\n  push:\n    branches: ["main", "commerce-foundation-v1"]\n\npermissions:\n  contents: read\n  pull-requests: write\n  issues: write\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v6\n        with:\n          persist-credentials: false\n\n      - name: Setup Node\n        uses: actions/setup-node@v6\n        with:\n          node-version: 22\n\n      - name: Run end-to-end commerce smoke test\n        id: smoke\n        continue-on-error: true\n        run: node test/commerce.smoke.mjs 2>&1 | tee smoke.log\n\n      - name: Report smoke-test failure\n        if: steps.smoke.outcome == 'failure'\n        env:\n          GH_TOKEN: ${{ github.token }}\n        run: |\n          {\n            echo "## Commerce smoke-test failure"\n            echo\n            echo '```text'\n            tail -n 120 smoke.log\n            echo '```'\n          } > smoke-comment.md\n          gh pr comment "${{ github.event.pull_request.number }}" --body-file smoke-comment.md\n\n      - name: Fail job after reporting\n        if: steps.smoke.outcome == 'failure'\n        run: exit 1\n