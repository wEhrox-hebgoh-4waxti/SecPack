name: SEC PACK CI

on:
  push:
    branches: ["main", "architecture-hardening"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check worker/advisor.js
      - run: node --check assets/js/admin.js
      - run: node --check assets/js/accounting.js
      - run: npm ci
      - run: npx wrangler deploy --dry-run
