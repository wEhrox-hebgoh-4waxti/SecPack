name: SEC PACK CI
# Production validation gate
# Accounting and session hardening validation

on:
  push:
    branches: ["main", "architecture-hardening"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --check worker/advisor.js
      - run: node --check assets/js/admin.js
      - run: node --check assets/js/accounting.js
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run test:db
      - run: npm run test:db:integrity
      - run: npx wrangler deploy --dry-run
