name: SEC PACK Live Smoke

on:
  push:
    branches: ["main", "architecture-hardening"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/smoke-live.mjs
