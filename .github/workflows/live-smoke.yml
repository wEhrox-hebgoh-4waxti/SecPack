name: SEC PACK Live Smoke

on:
  push:
    branches: ["main", "architecture-hardening"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/smoke-live.mjs
