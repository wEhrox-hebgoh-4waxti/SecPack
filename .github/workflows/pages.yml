name: Deploy SEC PACK to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Assemble public site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp index.html style.css i18n.js form-config.js logo.jpg site/
          cp robots.txt sitemap.xml site/
          [ -f site.webmanifest ] && cp site.webmanifest site/ || true
          [ -f CNAME ] && cp CNAME site/ || true
          cp -R pages assets .well-known site/
          rm -f site/assets/README* 2>/dev/null || true

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
