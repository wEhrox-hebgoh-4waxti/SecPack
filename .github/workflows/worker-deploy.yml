name: SEC PACK Worker Deploy

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "migrations/**"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secpack-production-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate JavaScript syntax
        run: |
          node --check worker/advisor.js
          node --check scripts/audit-migrations.mjs
          node --check scripts/smoke-live.mjs
          node --check scripts/test-db-integrity.mjs

      - name: Audit migration architecture
        run: npm run audit:migrations

      - name: Validate local D1 schema and integrity
        run: npm run test:db:integrity

      - name: Validate Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN GitHub Actions secret is not configured."
            exit 1
          fi
          npx wrangler@4.145.0 whoami
          npx wrangler@4.145.0 whoami --json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const x=JSON.parse(s);if(!(x.accounts||[]).some(v=>v.id==="3bd54dc7be56e0ade3d2e99a273853d6")){console.error("Token is not authorized for the SEC PACK Cloudflare account.");process.exit(1)}})'

      - name: Validate Wrangler configuration
        run: npx wrangler@4.145.0 deploy --dry-run --outdir=/tmp/secpack-worker-dryrun

      - name: Diagnose D1 control plane
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "=== D1 metadata ==="
          npx wrangler@4.145.0 d1 info secpack-prod --json
          echo "=== D1 read/query path ==="
          npx wrangler@4.145.0 d1 execute secpack-prod --remote --command="SELECT 1 AS ok"
          echo "=== D1 migration control path ==="
          npx wrangler@4.145.0 d1 migrations list secpack-prod --remote

      - name: Apply D1 migrations
        run: npx wrangler@4.145.0 d1 migrations apply secpack-prod --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler@4.145.0 deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live production
        run: node scripts/smoke-live.mjs
