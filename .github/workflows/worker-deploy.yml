name: SEC PACK Worker Deploy

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "migrations/**"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secpack-production-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate Worker syntax
        run: node --check worker/advisor.js

      - name: Validate Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN GitHub Actions secret is not configured."
            exit 1
          fi
          npx wrangler@4.145.0 whoami --json
          npx wrangler@4.145.0 whoami --json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const x=JSON.parse(s);if(!(x.accounts||[]).some(v=>v.id==="3bd54dc7be56e0ade3d2e99a273853d6")){console.error("Token is not authorized for the SEC PACK Cloudflare account.");process.exit(1)}})'

      - name: Validate Wrangler configuration
        run: npx wrangler@4.145.0 deploy --dry-run --outdir=/tmp/secpack-worker-dryrun

      - name: Verify D1 database access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/3bd54dc7be56e0ade3d2e99a273853d6/d1/database/a0c162d5-2706-428c-9be8-802968b2273c"

      - name: Inspect D1 migration state
        run: npx wrangler@4.145.0 d1 migrations list secpack-prod --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply D1 migrations
        run: npx wrangler@4.145.0 d1 migrations apply secpack-prod --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler@4.145.0 deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live production
        run: node scripts/smoke-live.mjs
