name: SEC PACK Worker Validation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Syntax check
        run: node --check worker/advisor.js
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --outdir=/tmp/secpack-worker-dryrun
