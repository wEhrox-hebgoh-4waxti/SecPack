
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SecPack Contact</title>

<link rel="stylesheet" href="../style.css">

</head>


<body>


<header class="topbar">


<div class="logo-area">

<div class="logo-box">
<img src="../logo.jpg" alt="SecPack Logo">
</div>


<div>

<h1>SecPack</h1>

<p>Professional Packaging Materials Supplier</p>

</div>

</div>



<div class="languages">

<button onclick="changeLanguage('en')">EN</button>
<button onclick="changeLanguage('fa')">FA</button>
<button onclick="changeLanguage('ar')">AR</button>

</div>


</header>





<section class="hero">


<h2 data-i18n="contact_title">
Request Quote
</h2>


<p data-i18n="contact_text">
Tell us your packaging requirements and our team will contact you.
</p>


</section>





<section class="cards">


<div class="card">


<h3>📩</h3>

<h2 data-i18n="contact_form">
Contact Information
</h2>


<p>Name</p>

<input type="text" placeholder="Your Name">



<p>Email / WhatsApp</p>

<input type="text" placeholder="Contact">



<p>Product Requirement</p>

<textarea placeholder="Describe your requirement"></textarea>



<br><br>


<button class="quote-button" data-i18n="send_button">

Send Request

</button>


</div>


</section>





<footer>

SecPack Enterprise © 2026

</footer>



<script src="../language.js"></script>

<script src="../script.js"></script>


</body>

</html>
