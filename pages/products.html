<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SecPack | Products</title>

<link rel="stylesheet" href="../style.css">

</head>

<body>

<header class="topbar">

<div class="logo-area">

<div class="logo-box">
<img src="../logo.jpg" alt="SecPack Logo">
</div>

<div>
<h1>SecPack</h1>
<p>Professional Packaging Materials</p>
</div>

</div>

<nav class="site-navigation">

<a href="../index.html">Home</a>

<a href="products.html" class="active">
Products
</a>

<a href="store.html">Store</a>

<a href="dashboard.html">Dashboard</a>

<a href="contact.html">Contact</a>

</nav>

<div class="languages">

<button onclick="changeLanguage('en')">
EN
</button>

<button onclick="changeLanguage('fa')">
FA
</button>

<button onclick="changeLanguage('ar')">
AR
</button>

</div>

</header>

<main>

<section class="hero">

<div class="hero-content">

<h1>
Products
</h1>

<p>
Professional packaging materials and technical solutions.
</p>

</div>

</section>

<section class="categories">

<div
id="products-container"
class="cards"></div>

</section>

</main>

<footer class="site-footer">

<div class="footer-bottom">

<p>
SecPack Enterprise © 2026
</p>

</div>

</footer>

<script src="../language.js"></script>
<script src="../data-engine.js"></script>

<script>

document.addEventListener("DOMContentLoaded", async () => {

    await window.SecPack.initialize();

    const container = document.getElementById("products-container");

    container.innerHTML = "";

    window.SecPack.products.forEach(product => {

        container.innerHTML += `

        <article class="card">

            <h2>${product.name}</h2>

            <p>${product.technical.description}</p>

            <strong>${product.category}</strong>

            <br><br>

            <a href="supplier-profile.html?product=${product.id}">
                View Details →
            </a>

        </article>

        `;

    });

});

</script>

<script src="../script.js"></script>

</body>

</html>
