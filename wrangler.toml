account_id = "3bd54dc7be56e0ade3d2e99a273853d6"
name = "secpack"
main = "worker/advisor.js"
compatibility_date = "2026-09-25"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "api.secpackco.com"
custom_domain = true

[vars]
OPENAI_MODEL = "gpt-5.6-terra"

[secrets]
required = ["OPENAI_API_KEY", "ADMIN_TOKEN"]

[[d1_databases]]
binding = "DB"
database_name = "secpack-prod"
database_id = "a0c162d5-2706-428c-9be8-802968b2273c"
migrations_dir = "migrations"

[triggers]
crons = ["*/15 * * * *"]
